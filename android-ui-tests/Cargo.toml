[package]
name = "android-ui-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Headless driver that drives the nsh Android app (com.example.nshexample) via the `dev` host and captures its real, frame-synced screenshots."

# A dev tool that drives the app through the `dev` host. It is a member of the
# root workspace (built only for the host target), using nsh-dev's server
# feature. Kept as a separate package from the app so its host-only build is
# explicit and is never compiled for the app's iOS/Android targets.
# (Do NOT add a `[workspace]` table here: that would make this crate the root
# of its own workspace and drop it out of the root workspace entirely.)

[dependencies]
# Host-side nsh test protocol (DevServer, TestStep, WS_PATH). Kept in sync with
# the app's `nsh-platform-android` runtime, which resolves `nsh-dev 0.5.x`.
nsh-dev = { version = "0.5.1", features = ["server"] }
anyhow = "1"
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "android-ui-tests"
path = "src/main.rs"
