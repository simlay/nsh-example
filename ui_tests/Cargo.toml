[package]
name = "ui_tests"
edition = "2024"

[target.'cfg(target_os = "ios")'.dependencies]
env_logger = "0.11"
objc2 = "0.6.5"
objc2-xc-test = { version = "0.3", default-features = false }
objc2-xc-ui-automation = { version = "0.3", default-features = false, features = ["objc2-core-foundation"] }
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

ctor = { version = "1.0", default-features = false, features = ["proc_macro"] }
