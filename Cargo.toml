[package]
name = "nsh-app-nsh-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [
    "ui_tests",
]
resolver = "2"

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }

