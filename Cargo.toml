[package]
name = "nsh-app-nsh-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["ui_tests"]
resolver = "2"

# Built as a `cdylib` so it links into an APK as `libnsh.so`, and a `rlib` so
# the desktop `[[bin]]` can link it. Do NOT name it `nsh` here: that collides
# with the `nsh-platform-android` runtime crate's own lib name (`nsh`), which
# confuses cargo's extern linking. Instead the Gradle script renames the
# built `.so` to `libnsh.so` after cargo finishes (the runtime's
# `System.loadLibrary("nsh")` looks for that file name). See the `android/`
# Gradle project.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = "0.11"

# Platform-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
#nsh-platform-web = { version = "0.3.0", features = ["browser"] }
#nsh-engine = { version = "0.4.0", features = ["browser"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "console"] }
futures-channel = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "0.5.0", default-features = false }
