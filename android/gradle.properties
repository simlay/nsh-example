# Gradle build optimization settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=4

# Android-specific optimizations
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.suppressUnsupportedCompileSdk=35

# IDE optimizations
studio.enableAssetPackaging=true
studio.useLegacyPackaging=false

# Configuration cache (experimental but beneficial)
org.gradle.configuration-cache=true
